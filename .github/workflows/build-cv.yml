name: Build CV

on:
  push:
    branches: [main]
    paths:
      - '**.tex'
      - '**.cls'
      - '**.sty'
      - 'Fonts/**'
      - '.github/workflows/build-cv.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out CV repository
        uses: actions/checkout@v4

      - name: Compile CV with XeLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: CV.tex
          latexmk_use_xelatex: true
          args: "-file-line-error -halt-on-error -interaction=nonstopmode"

      - name: Verify generated PDF
        run: test -s CV.pdf

      - name: Upload compiled CV
        uses: actions/upload-artifact@v4
        with:
          name: CV-Yonghun-Suh
          path: CV.pdf
          if-no-files-found: error

      # Never rebase a generated binary PDF. Keep the compiled artifact,
      # refresh the branch first, then create a commit atop the latest main.
      - name: Commit generated CV PDF
        shell: bash
        run: |
          set -euo pipefail
          cp CV.pdf "$RUNNER_TEMP/compiled-CV.pdf"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          # A newer source revision requires a fresh compile, not an old PDF.
          if ! git diff --quiet "$GITHUB_SHA" origin/main -- '*.tex' '*.cls' '*.sty' 'Fonts/'; then
            echo "::error::CV sources changed during this build; rerun on the latest main."
            exit 1
          fi

          # Checkout the latest main rather than rebasing the generated binary.
          git restore --worktree -- CV.pdf
          git switch -C cv-publish origin/main
          cp "$RUNNER_TEMP/compiled-CV.pdf" CV.pdf
          git add -f -- CV.pdf
          if git diff --cached --quiet -- CV.pdf; then
            echo "CV.pdf is unchanged."
            exit 0
          fi
          git commit -m "docs: update compiled CV PDF [skip ci]"
          git push origin HEAD:main

      - name: Prepare CV for GitHub Pages
        run: |
          mkdir -p _site
          cp CV.pdf _site/CV.pdf

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
