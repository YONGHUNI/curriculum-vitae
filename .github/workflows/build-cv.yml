name: Build CV

on:
  push:
    branches: [main]
    paths:
      - '**.tex'
      - '**.cls'
      - '**.sty'
      - 'Fonts/**'
      - '.github/workflows/build-cv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out CV repository
        uses: actions/checkout@v4

      - name: Compile CV with XeLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: CV.tex
          latexmk_use_xelatex: true
          args: "-file-line-error -halt-on-error -interaction=nonstopmode"

      - name: Verify generated PDF
        run: test -s CV.pdf

      - name: Upload compiled CV
        uses: actions/upload-artifact@v4
        with:
          name: CV-Yonghun-Suh
          path: CV.pdf
          if-no-files-found: error

      - name: Commit generated CV PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f CV.pdf
          if git diff --cached --quiet; then
            echo "CV.pdf is unchanged."
            exit 0
          fi
          git commit -m "docs: update compiled CV PDF"
          git pull --rebase origin main
          git push origin HEAD:main
